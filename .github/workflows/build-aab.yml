name: Build Android App Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build --if-present
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build AAB and APK with Gradle
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease -PversionCode=${{ github.run_number }} --no-daemon -x test

      - name: Upload AAB Artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK Artifact (Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
